# Pinned Mixxx package for DecksmithOS.
#
# The Debian source package is taken from Debian (currently sid) and rebuilt
# unchanged against the DecksmithOS base release, so it links against that
# release's Qt/FFmpeg instead of pulling libraries from sid.
# To update: change the source version (and snapshot timestamp), reset the
# local revision to 1, and run the "Mixxx package" workflow.

MIXXX_SOURCE_VERSION="2.5.6+dfsg-3"
# snapshot.debian.org timestamp at which this source version is in the archive
# (fallback once it leaves deb.debian.org/debian/pool).
MIXXX_SNAPSHOT_TIMESTAMP="20260923T083042Z"
MIXXX_TARGET_SUITE="trixie"
# Build tools taken from <suite>-backports (build time only; the resulting
# package still links only against the base suite's libraries).
# 2.5.6+dfsg-3 needs debhelper-compat (= 14), which trixie's debhelper lacks.
MIXXX_BACKPORTED_BUILD_TOOLS="debhelper"
# Sorts below the Debian version and above trixie's own 2.5.0+dfsg-3+b1.
MIXXX_LOCAL_SUFFIX="~deb13decksmithos10"

# GitHub repository whose releases hold the built packages (see pin-release.sh).
MIXXX_RELEASE_REPO="decksmithos/decksmithos"
