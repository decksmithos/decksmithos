# DecksmithOS: stable, controller-agnostic name for the controller's USB audio
# interface. Mixxx's soundconfig.xml refers to the PCM "decksmithos"; the
# launcher (decksmithos-mixxx) exports DECKSMITHOS_ALSA_CARD with the ALSA card
# id of the first USB playback device it finds. Card 0 is the fallback.
pcm.decksmithos {
    type hw
    card {
        @func getenv
        vars [ DECKSMITHOS_ALSA_CARD ]
        default 0
    }
    device 0
    hint {
        show on
        description "DecksmithOS controller audio"
    }
}
