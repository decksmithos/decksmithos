# DecksmithOS: CPUs at full clock all the time (governor "performance"):
# "ondemand" lowers the clock in quiet moments and needs time to raise it
# again when a peak of work arrives (a track load, a waveform zoom), which is
# when audio buffers run late. Costs a little more power and heat (the fan
# copes; watch the temperature on long runs).
w /sys/devices/system/cpu/cpufreq/policy*/scaling_governor - - - - performance
