# DecksmithOS: every service and the session (X, Mixxx's GUI and background
# threads) run on CPUs 0-2; CPU 3 is kept for Mixxx's audio thread, which
# moves itself there (DECKSMITHOS_AUDIO_CPUS, Mixxx patch 0018). Kernel
# interrupts default to 0-2 as well (irqaffinity= in cmdline.txt).
[Manager]
CPUAffinity=0-2
