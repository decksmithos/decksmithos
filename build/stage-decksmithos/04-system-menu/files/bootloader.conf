# DecksmithOS bootloader (EEPROM) settings, written together with the bootloader
# by "Update bootloader" in the system menu (decksmithos-system bootloader-update).
# Measured on a CM5 IO board (2026-11-20): with the 2026-10-30 bootloader,
# firmware + bootloader went from ~8.9 s to ~8.0 s with these settings.
[all]
# Silent bootloader UART (no log output on the debug UART).
BOOT_UART=0
# NVMe first, then eMMC/SD, then USB mass storage, then retry (read right to left).
BOOT_ORDER=0xf416
# No network-install screen at power on.
NET_INSTALL_AT_POWER_ON=0
# No HDMI diagnostics screen in the bootloader (the DecksmithOS display is DSI;
# the kernel still drives HDMI normally).
DISABLE_HDMI=1
