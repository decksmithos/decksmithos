# Display profile td2: long press = right click (no mouse on the appliance).
# Mixxx uses right click for context menus (library, hotcues) and to reset knobs.
#
# Trade-off of evdev's emulation: a touch is only delivered as a left click
# once the finger moves or is lifted, and holding still for the timeout turns
# it into a right click. Holding an on-screen button (e.g. cue preview) is
# therefore not possible by touch. Delete this file to turn the emulation off.
Section "InputClass"
    Identifier "Goodix Touch Long Press"
    MatchProduct "Goodix Capacitive TouchScreen"
    Option "EmulateThirdButton" "1"
    Option "EmulateThirdButtonTimeout" "800"
    Option "EmulateThirdButtonMoveThreshold" "30"
EndSection
