# Display profile td2: Raspberry Pi Touch Display 2, 7-inch (diagonal of the
# active area), 720x1280 panel used as 1280x720. The DSI panel reports no
# physical size (xrandr: 0mm x 0mm), so decksmithos-mixxx uses this to size
# touch targets. HDMI screens report their size in the EDID.
DISPLAY_DIAGONAL_INCH="7.0"
