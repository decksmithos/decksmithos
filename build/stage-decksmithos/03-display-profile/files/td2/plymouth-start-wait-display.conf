# Display profile td2: start Plymouth only once the DSI panel's DRM device
# exists. Plymouth started at ~1.0 s, the panel's driver (drm-rp1-dsi, a module
# loaded by udev) a few hundred ms later; in between Plymouth fell back to its
# text theme ("3 box countdown": three small squares, top left). At most 3 s,
# then Plymouth starts anyway.
[Service]
ExecStartPre=-/usr/bin/udevadm wait --timeout=3 /dev/dri/by-path/platform-1f00118000.dsi-card
