# DecksmithOS: stop the X session quickly and cleanly.
# nodm answers SIGTERM by starting a new X session; those new processes never
# get the stop signal, so every shutdown waited for the stop timeout (measured
# on CM5: 9.3 s of a 10.5 s shutdown). Stop Mixxx first and let it save
# (SIGTERM, up to 15 s), then end everything left in the session at once.
[Service]
ExecStop=/bin/sh -c "pkill -TERM -x mixxx; for i in $(seq 150); do pgrep -x mixxx >/dev/null || exit 0; sleep 0.1; done"
KillSignal=SIGKILL
TimeoutStopSec=20s
